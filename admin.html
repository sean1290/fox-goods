<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fox 굿즈 주문 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #F7F5F3; --card: #fff; --ink: #1F1A17; --muted: #7A6F67; --line: #ECE4DC;
          --fox: #F26B1D; --fox-soft: #FFEBDD; --ok: #1E8E5A; --ok-soft: #E3F5EC; --warn: #B26A00; --warn-soft: #FFF4DC; --err: #C62828; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
         font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 36px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: #D8CCC0; }
  .btn.fox { background: var(--fox); border-color: var(--fox); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* login */
  .login { max-width: 340px; margin: 12vh auto 0; background: #fff; border-radius: 18px; padding: 28px; text-align: center; border: 1px solid var(--line); }
  .login img { width: 80px; }
  .login h2 { margin: 6px 0 16px; font-size: 18px; }
  .login input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-size: 16px; }
  .login .btn { width: 100%; margin-top: 10px; padding: 12px; }
  .err { color: var(--err); margin-top: 10px; min-height: 1em; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; font-weight: 600; }
  .stat .v { font-size: 22px; font-weight: 800; margin-top: 2px; }
  .stat .s { color: var(--muted); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .tally { display: flex; flex-wrap: wrap; gap: 18px; }
  .tally .p { min-width: 220px; }
  .tally .p b { display: block; margin-bottom: 6px; }
  .tally .cells { display: flex; flex-wrap: wrap; gap: 6px; }
  .tally .cell { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
  .tally .cell span { font-weight: 800; color: var(--fox); margin-left: 4px; }

  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-top: 14px; font-size: 13px; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 18px 0 10px; }
  .tabs { display: flex; gap: 4px; background: #EDE7E1; padding: 4px; border-radius: 12px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .tabs .c { font-size: 12px; margin-left: 3px; }
  .search { flex: 1; min-width: 160px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #FBF8F5; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tr.cancel td { opacity: .45; }
  tr.cancel td.act { opacity: 1; }
  .id { font-weight: 700; white-space: nowrap; }
  .dt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .money { font-weight: 700; white-space: nowrap; }
  .tag { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tag.wait { background: var(--warn-soft); color: var(--warn); }
  .tag.paid { background: var(--ok-soft); color: var(--ok); }
  .tag.sent { background: #E8EEFC; color: #2F55C4; }
  .tag.cx { background: #EEE; color: #666; }
  .sub { color: var(--muted); font-size: 12px; }
  .act { white-space: nowrap; }
  .act .btn { margin: 2px 0; }
  .more { position: relative; display: inline-block; }
  .menu { position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.1); z-index: 5; min-width: 150px; padding: 4px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; }
  .menu button:hover { background: #F6F1EC; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 440px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 8px; }
  dialog pre { white-space: pre-wrap; background: #FBF8F5; border-radius: 10px; padding: 12px; font: inherit; font-size: 13px; max-height: 280px; overflow: auto; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; }
  .hidden { display: none !important; }

  @media (max-width: 860px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    table, tbody, tr, td { display: block; border: 0; }
    thead { display: none; }
    table { background: none; }
    tr { background: #fff; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 8px 4px; }
    td { padding: 4px 12px; border: 0; }
    td[data-l]::before { content: attr(data-l); color: var(--muted); font-size: 12px; display: inline-block; width: 64px; }
    td.act { padding-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <form class="login" id="login">
    <img src="images/fox.png" alt="">
    <h2>주문 관리</h2>
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button class="btn fox" type="submit">들어가기</button>
    <div class="err" id="loginErr"></div>
  </form>

  <!-- 관리 화면 -->
  <div id="app" class="hidden">
    <header>
      <h1><img src="images/fox.png" alt="">Fox 굿즈 주문 관리</h1>
      <div style="display:flex;gap:8px">
        <button class="btn" id="refresh">새로고침</button>
        <button class="btn" id="logout">로그아웃</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>
    <div class="banner hidden" id="smsBanner">
      문자 자동 발송이 아직 설정되지 않았어요. 버튼을 누르면 휴대폰 문자 앱으로 보낼 수 있게 열어드려요. (설정 방법: README 4단계)
    </div>

    <div class="card">
      <h3>마플 주문용 집계 <small>입금 확인된 주문만 · 취소 제외</small></h3>
      <div class="tally" id="tally"></div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="search" placeholder="이름·번호·주문번호 검색">
      <button class="btn ok" id="bulk">도착 문자 한꺼번에 보내기</button>
    </div>

    <table>
      <thead><tr>
        <th>주문번호</th><th>주문자</th><th>상품</th><th>금액</th><th>입금</th><th>문자</th><th style="text-align:right">관리</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hidden" id="empty">해당하는 주문이 없어요.</div>
  </div>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <div id="dlgBody"></div>
  <div class="row" id="dlgBtns"></div>
</dialog>

<script>
// Apps Script 웹 앱 URL — index.html 과 같은 주소
const SCRIPT_URL = '';

const $ = id => document.getElementById(id);
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let password = '', orders = [], smsReady = true, filter = 'all';
try { password = sessionStorage.getItem('foxshop_pw') || ''; } catch (_) {}

async function api(body) {
  if (!SCRIPT_URL) throw new Error('admin.html 의 SCRIPT_URL 을 먼저 설정해 주세요.');
  const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ ...body, password }) });
  const d = await res.json();
  if (d.status !== 'ok') throw new Error(d.message || '오류');
  return d;
}

$('login').addEventListener('submit', async e => {
  e.preventDefault();
  password = $('pw').value; $('loginErr').textContent = '';
  try { await load(); try { sessionStorage.setItem('foxshop_pw', password); } catch (_) {} }
  catch (err) { $('loginErr').textContent = err.message; }
});
$('logout').onclick = () => { try { sessionStorage.removeItem('foxshop_pw'); } catch (_) {} location.reload(); };
$('refresh').onclick = () => load().then(() => toast('새로고침 했어요')).catch(err => toast(err.message));
$('search').addEventListener('input', render);

async function load() {
  const d = await api({ action: 'adminList' });
  orders = d.orders.reverse();       // 최신 주문이 위로
  smsReady = d.smsReady;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('smsBanner').classList.toggle('hidden', smsReady);
  render();
}

const isPaid = o => !!o.paid, isSent = o => !!o.arrivalSms;
const FILTERS = [
  ['all', '전체', o => !o.cancelled],
  ['wait', '입금 대기', o => !o.cancelled && !isPaid(o)],
  ['paid', '입금 완료 · 도착 전', o => !o.cancelled && isPaid(o) && !isSent(o)],
  ['sent', '도착 문자 보냄', o => !o.cancelled && isSent(o)],
  ['cx', '취소', o => o.cancelled]
];

function render() {
  const live = orders.filter(o => !o.cancelled), paid = live.filter(isPaid);
  const sum = a => a.reduce((t, o) => t + o.total, 0), cnt = a => a.reduce((t, o) => t + o.qty, 0);
  $('stats').innerHTML = [
    ['전체 주문', live.length + '건', cnt(live) + '벌'],
    ['입금 대기', live.filter(o => !isPaid(o)).length + '건', won(sum(live.filter(o => !isPaid(o))))],
    ['입금 완료', paid.length + '건', won(sum(paid))],
    ['도착 문자 보냄', live.filter(isSent).length + '건', '남은 ' + paid.filter(o => !isSent(o)).length + '건']
  ].map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

  // 마플 주문용 집계
  const t = {};
  paid.forEach(o => { t[o.product] ??= {}; t[o.product][o.size] = (t[o.product][o.size] || 0) + o.qty; });
  $('tally').innerHTML = Object.keys(t).length ? Object.entries(t).map(([p, sizes]) =>
    `<div class="p"><b>${esc(p)} · 총 ${Object.values(sizes).reduce((a, b) => a + b, 0)}벌</b><div class="cells">` +
    Object.entries(sizes).sort((a, b) => sizeKey(a[0]) - sizeKey(b[0]))
      .map(([s, n]) => `<div class="cell">${esc(s)}<span>${n}</span></div>`).join('') + '</div></div>').join('')
    : '<div class="sub">아직 입금 확인된 주문이 없어요.</div>';

  $('tabs').innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button data-k="${k}" class="${filter === k ? 'on' : ''}">${label}<span class="c">${orders.filter(fn).length}</span></button>`).join('');
  [...$('tabs').children].forEach(b => b.onclick = () => { filter = b.dataset.k; render(); });

  const q = $('search').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  const fn = FILTERS.find(f => f[0] === filter)[2];
  const list = orders.filter(fn).filter(o => !q ||
    o.name.toLowerCase().includes(q) || o.id.toLowerCase().includes(q) || (qd && o.phone.replace(/\D/g, '').includes(qd)));

  const pending = live.filter(o => isPaid(o) && !isSent(o)).length;
  $('bulk').disabled = !pending;
  $('bulk').textContent = `도착 문자 한꺼번에 보내기 (${pending})`;

  $('empty').classList.toggle('hidden', list.length > 0);
  $('rows').innerHTML = list.map(o => `
    <tr class="${o.cancelled ? 'cancel' : ''}" data-id="${esc(o.id)}">
      <td data-l="주문"><div class="id">${esc(o.id)}</div><div class="dt">${esc(o.date)}</div></td>
      <td data-l="주문자"><b>${esc(o.name)}</b><div class="sub">${esc(o.phone)}</div></td>
      <td data-l="상품">${esc(o.product)}<div class="sub">${esc(o.size)} · ${o.qty}개</div></td>
      <td data-l="금액" class="money">${won(o.total)}</td>
      <td data-l="입금">${o.cancelled ? '<span class="tag cx">취소</span>' : isPaid(o)
          ? `<span class="tag paid">입금 완료</span><div class="dt">${esc(o.paid)}</div>` : '<span class="tag wait">입금 대기</span>'}</td>
      <td data-l="문자">
        <div class="sub">주문: ${o.confirmSms.startsWith('발송') ? '보냄' : o.confirmSms ? '<span style="color:var(--err)">못 보냄</span>' : '-'}</div>
        <div class="sub">도착: ${isSent(o) ? `<span class="tag sent">보냄</span> ${esc(o.arrivalAt)}` : '-'}</div>
      </td>
      <td class="act" style="text-align:right">
        ${o.cancelled ? '' : isPaid(o) ? '' : `<button class="btn sm" data-a="paid">입금 확인</button>`}
        ${o.cancelled ? '' : `<button class="btn sm ${isSent(o) ? '' : 'ok'}" data-a="arrive">${isSent(o) ? '도착 문자 다시' : '도착 문자 보내기'}</button>`}
        <span class="more"><button class="btn sm" data-a="more">⋯</button></span>
      </td>
    </tr>`).join('');
}

function sizeKey(s) { const n = parseInt(s, 10); return isNaN(n) ? 1000 + ['XS','S','M','L','XL','2XL','XXL','3XL'].indexOf(s) : n; }

$('rows').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.closest('tr').dataset.id, o = orders.find(x => x.id === id);
  const a = b.dataset.a;
  if (a === 'paid') return act(b, { action: 'setPaid', id, paid: true }, '입금 확인했어요');
  if (a === 'arrive') {
    if (isSent(o) && !confirm(`${o.name}님께 도착 문자를 이미 보냈어요. 다시 보낼까요?`)) return;
    if (!isSent(o) && !isPaid(o) && !confirm('아직 입금 확인이 안 된 주문이에요. 그래도 도착 문자를 보낼까요?')) return;
    return sendArrival(b, o);
  }
  if (a === 'more') return openMenu(b, o);
  if (a === 'unpaid') return act(b, { action: 'setPaid', id, paid: false }, '입금 확인을 취소했어요');
  if (a === 'resend') return sendMsg(b, { action: 'resendConfirm', id }, '주문 문자');
  if (a === 'cancel' && confirm(`${o.id} (${o.name}) 주문을 취소 처리할까요?`)) return act(b, { action: 'setCancelled', id, cancelled: true }, '취소 처리했어요');
  if (a === 'uncancel') return act(b, { action: 'setCancelled', id, cancelled: false }, '취소를 되돌렸어요');
});

function openMenu(btn, o) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = (o.cancelled ? '<button data-a="uncancel">취소 되돌리기</button>' : `
    ${isPaid(o) ? '<button data-a="unpaid">입금 확인 취소</button>' : ''}
    <button data-a="resend">주문 문자 다시 보내기</button>
    <button data-a="cancel" style="color:var(--err)">주문 취소</button>`);
  btn.parentElement.appendChild(m);
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }));
}
function closeMenu() { document.querySelectorAll('.menu').forEach(m => m.remove()); }

async function act(btn, body, msg) {
  btn.disabled = true;
  try { const r = await api(body); replace(r.order); toast(msg); }
  catch (err) { toast(err.message); btn.disabled = false; }
}
function replace(o) { const i = orders.findIndex(x => x.id === o.id); if (i >= 0) orders[i] = o; render(); }

async function sendArrival(btn, o) {
  btn.disabled = true; btn.textContent = '보내는 중…';
  try {
    const r = await api({ action: 'sendArrival', id: o.id });
    if (r.sent) { await load(); toast(`${o.name}님께 도착 문자를 보냈어요`); }
    else showManual(r, o, true);
  } catch (err) { toast(err.message); render(); }
}

async function sendMsg(btn, body, label) {
  try {
    const r = await api(body);
    const o = orders.find(x => x.id === body.id);
    if (r.sent) { await load(); toast(label + '를 보냈어요'); } else showManual(r, o, false);
  } catch (err) { toast(err.message); }
}

// 자동 발송이 안 될 때: 휴대폰 문자 앱으로 열기
function showManual(r, o, isArrival) {
  render();
  $('dlgTitle').textContent = '문자 앱으로 보내기';
  $('dlgBody').innerHTML = `<div class="sub" style="margin-bottom:8px">자동 발송이 안 됐어요${r.error ? ` (${esc(r.error)})` : ''}. 아래 내용을 직접 보내 주세요.</div>
    <div><b>${esc(r.phone)}</b></div><pre>${esc(r.text)}</pre>`;
  const sep = /iPhone|iPad|Mac/.test(navigator.userAgent) ? '&' : '?';
  $('dlgBtns').innerHTML = `
    <button class="btn" data-d="copy">내용 복사</button>
    <a class="btn fox" style="text-decoration:none" href="sms:${r.phone.replace(/\D/g, '')}${sep}body=${encodeURIComponent(r.text)}">문자 앱 열기</a>
    ${isArrival ? '<button class="btn ok" data-d="mark">보냈어요 (보냄으로 표시)</button>' : ''}
    <button class="btn" data-d="close">닫기</button>`;
  $('dlgBtns').onclick = async e => {
    const d = e.target.dataset.d;
    if (d === 'copy') { try { await navigator.clipboard.writeText(r.text); toast('복사했어요'); } catch (_) { toast('복사가 안 됐어요'); } }
    if (d === 'close') $('dlg').close();
    if (d === 'mark') { $('dlg').close(); try { await api({ action: 'sendArrival', id: o.id, markOnly: true }); await load(); toast('보냄으로 표시했어요'); } catch (err) { toast(err.message); } }
  };
  $('dlg').showModal();
}

$('bulk').onclick = async () => {
  const targets = orders.filter(o => !o.cancelled && isPaid(o) && !isSent(o));
  if (!targets.length) return;
  if (!smsReady) return toast('자동 문자 설정 후 사용할 수 있어요. 한 건씩 보내 주세요.');
  if (!confirm(`입금 완료 · 도착 문자 안 보낸 ${targets.length}건에 도착 문자를 보낼까요?`)) return;
  const b = $('bulk'); b.disabled = true;
  let ok = 0, fail = 0;
  for (const [i, o] of targets.entries()) {
    b.textContent = `보내는 중… ${i + 1}/${targets.length}`;
    try { const r = await api({ action: 'sendArrival', id: o.id }); r.sent ? ok++ : fail++; } catch (_) { fail++; }
  }
  await load();
  toast(`${ok}건 보냄${fail ? ` · ${fail}건 실패` : ''}`);
};

let toastTimer;
function toast(msg) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

if (password) load().catch(() => { password = ''; });
</script>
</body>
</html>
